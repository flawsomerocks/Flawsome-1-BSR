name: Daily BSR Update

on:
  schedule:
    # Runs every day at 06:00 UTC — adjust to suit your timezone
    - cron: "0 6 * * *"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update-bsr:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BSR updater
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.SHEET_NAME || 'BSR Tracking' }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE || 'com' }}
        run: python update_bsr.py
